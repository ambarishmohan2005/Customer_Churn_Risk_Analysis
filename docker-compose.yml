version: '3.8'

services:
  # 1. FastAPI Machine Learning Inference Microservice
  backend:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: churn_fastapi_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - WORKERS=2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - churn_network

  # 2. Streamlit Web Client
  streamlit-frontend:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: churn_streamlit_client
    restart: always
    ports:
      - "8501:8501"
    environment:
      - BACKEND_API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - churn_network

  # 3. Modern React Single-Page Application
  react-frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile.react
    container_name: churn_react_client
    restart: always
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - churn_network

networks:
  churn_network:
    driver: bridge
